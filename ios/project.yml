name: BatteryETA
options:
  developmentLanguage: en
  bundleIdPrefix: com.mlapin.marstek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: WSCTL2V8W5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BatteryETA:
    type: application
    platform: iOS
    sources: [{ path: App, excludes: [icon.svg] }, Shared]
    dependencies:
      - target: BatteryWidget
    entitlements:
      path: App/BatteryETA.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mlapin.marstek.battery]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Battery ETA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Battery ETA reads your Marstek battery over your home Wi-Fi.
        NSLocationWhenInUseUsageDescription: Battery ETA finds your street once to look up your outage group.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, uk]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mlapin.marstek.battery.alert]
        CFBundleURLTypes:
          - CFBundleURLName: com.mlapin.marstek.battery
            CFBundleURLSchemes: [batteryeta]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlapin.marstek.battery
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [BatteryTests]
  BatteryWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/BatteryWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mlapin.marstek.battery]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Battery ETA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleLocalizations: [en, uk]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlapin.marstek.battery.widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  BatteryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BatteryETA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
